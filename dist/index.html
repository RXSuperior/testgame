<script>// ==== src/core/ns.js ====
// Namespace กลาง: ทุกโมดูลลงทะเบียนที่ AW ไม่สร้างตัวแปร global อื่น
(function(g){g.AW=g.AW||{core:{},systems:{},data:{worlds:[],assets:[]},ui:{}}})(globalThis);

// ==== src/core/rng.js ====
// สุ่มแบบมี seed (mulberry32) สถานะเป็นตัวเลขเดียว เก็บในเซฟได้ ผลซ้ำได้เมื่อ seed เดิม
(function(AW){
function hashSeed(s){let h=2166136261>>>0;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
class Rng{
 constructor(seed){this.state=typeof seed==='number'?seed>>>0:hashSeed(seed??Date.now())}
 next(){let t=this.state=(this.state+0x6D2B79F5)>>>0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
 int(a,b){return a+Math.floor(this.next()*(b-a+1))}
 chance(p){return this.next()<p}
 pick(arr){return arr[Math.floor(this.next()*arr.length)]}
}
AW.core.Rng=Rng;AW.core.hashSeed=hashSeed;
})(globalThis.AW);

// ==== src/core/bus.js ====
// Event Bus: ระบบคุยกันผ่านเหตุการณ์ แทนการห่อฟังก์ชันของกันและกัน
// ตัวรับที่ error ไม่หยุดตัวรับอื่น (error ถูกส่งต่อเป็นเหตุการณ์ 'bus:error')
(function(AW){
class Bus{
 constructor(){this.h=new Map();this.trace=null}
 on(ev,fn,{prio=0,owner='?'}={}){const l=this.h.get(ev)||[];const e={fn,prio,owner};l.push(e);l.sort((a,b)=>b.prio-a.prio);this.h.set(ev,l);return()=>this.off(ev,fn)}
 off(ev,fn){const l=this.h.get(ev);if(l)this.h.set(ev,l.filter(e=>e.fn!==fn))}
 emit(ev,payload){if(this.trace)this.trace(ev,payload);const l=this.h.get(ev);if(!l)return 0;let n=0;
  for(const e of l.slice()){try{e.fn(payload);n++}catch(err){if(ev!=='bus:error')this.emit('bus:error',{ev,owner:e.owner,err});else console.error(err)}}return n}
 listeners(ev){return(this.h.get(ev)||[]).map(e=>e.owner)}
}
AW.core.Bus=Bus;
})(globalThis.AW);

// ==== src/core/state.js ====
// Game State: แบ่งเป็น slice แต่ละ slice มีเจ้าของ (ระบบเดียวที่เขียนได้)
// อ่าน: state.get(name) ได้ object ที่ freeze ทั้งต้นไม้ แก้ไม่ได้ (strict mode จะ throw)
// เขียน: state.mutate(owner,name,fn) fn ได้สำเนาที่แก้ได้ แล้วสำเนานั้นจะถูก freeze เป็นค่าใหม่ (copy-on-write)
// อ่านไม่เสียค่าใช้จ่าย เขียนเสียค่า clone ของ slice นั้น slice เดียว
// ข้อมูลใน slice ต้องเป็น JSON ล้วน (เพราะต้องเซฟได้)
(function(AW){
'use strict';
const SCHEMA_VERSION=1;
const clone=v=>v===undefined?v:JSON.parse(JSON.stringify(v));
function deepFreeze(o){if(o&&typeof o==='object'&&!Object.isFrozen(o)){Object.freeze(o);for(const k of Object.keys(o))deepFreeze(o[k])}return o}
const kind=v=>Array.isArray(v)?'array':v===null?'null':typeof v;
class GameState{
 constructor(bus){this.bus=bus;this.slices=new Map();this.data={};this.orphans={}}
 // slice ที่มีในเซฟแต่ยังไม่มีใครลงทะเบียน (orphan) จะถูกเก็บไว้ไม่หาย และถูกรับไปใช้เมื่อมีการ register ชื่อนั้นทีหลัง
 register(name,owner,init){if(this.slices.has(name))throw new Error(`slice "${name}" ซ้ำ (เจ้าของเดิม ${this.slices.get(name).owner})`);this.slices.set(name,{owner,init});
  const o=this.orphans[name],fresh=init();delete this.orphans[name];this.data[name]=deepFreeze(clone(o!==undefined&&kind(o)===kind(fresh)?o:fresh))}
 owner(name){const s=this.slices.get(name);if(!s)throw new Error(`ไม่มี slice "${name}"`);return s.owner}
 get(name){if(!this.slices.has(name))throw new Error(`ไม่มี slice "${name}"`);return this.data[name]}
 mutate(owner,name,fn){const o=this.owner(name);if(o!==owner)throw new Error(`"${owner}" เขียน slice "${name}" ไม่ได้ (เจ้าของคือ "${o}")`);
  const draft=clone(this.data[name]);const r=fn(draft);this.data[name]=deepFreeze(draft);this.bus&&this.bus.emit('state:changed',{name,owner});return r}
 reset(){this.orphans={};for(const[n,s]of this.slices)this.data[n]=deepFreeze(clone(s.init()))}
 snapshot(){return{version:SCHEMA_VERSION,data:clone(Object.assign({},this.orphans,this.data))}}
 // ตรวจรูปแบบ snapshot โดยไม่แตะ state: คืน null ถ้าผ่าน หรือข้อความ error
 check(snap){if(!snap||typeof snap!=='object')return'snapshot ไม่ใช่ object';if(snap.version!==SCHEMA_VERSION)return'เวอร์ชันเซฟไม่ตรง ('+snap.version+')';
  if(kind(snap.data)!=='object')return'data ต้องเป็น object';
  for(const[n,s]of this.slices){if(!(n in snap.data))continue;const a=kind(snap.data[n]),b=kind(s.init());if(a!==b)return`slice "${n}" ผิดชนิด (${a} แทน ${b})`}return null}
 restore(snap){const e=this.check(snap);if(e)throw new Error(e);this.reset();for(const n of Object.keys(snap.data)){if(this.slices.has(n))this.data[n]=deepFreeze(clone(snap.data[n]));else this.orphans[n]=deepFreeze(clone(snap.data[n]))}}
}
AW.core.GameState=GameState;AW.core.SCHEMA_VERSION=SCHEMA_VERSION;AW.core.deepFreeze=deepFreeze;
})(globalThis.AW);

// ==== src/core/loop.js ====
// Game Loop: 1 tick = 1 เดือนของโลกหลัก
// ลำดับต่อ tick: month:before -> month -> month:after (ระบบต่าง ๆ ฟังเหตุการณ์เหล่านี้)
// หยุดได้หลายเหตุผลพร้อมกัน (เปิดเมนู, มีเหตุการณ์รอ, ต่อสู้) เดินต่อเมื่อเหตุผลหมด
(function(AW){
'use strict';
class Loop{
 constructor(state,bus,{owner='loop',baseMs=1200,timer=globalThis}={}){this.state=state;this.bus=bus;this.owner=owner;this.baseMs=baseMs;this.timer=timer;this.speed=0;this.reasons=new Set();this.h=null;
  state.register('time',owner,()=>({month:0}))}
 get month(){return this.state.get('time').month}
 tick(force=false){if(this.reasons.size&&!force)return false;const m=this.month+1;this.bus.emit('month:before',{month:m});this.state.mutate(this.owner,'time',t=>{t.month=m});this.bus.emit('month',{month:m});this.bus.emit('month:after',{month:m});return true}
 step(n=1){let d=0;for(let i=0;i<n;i++)if(this.tick())d++;return d}
 setSpeed(s){this.speed=s;if(this.h){this.timer.clearInterval(this.h);this.h=null}if(s>0)this.h=this.timer.setInterval(()=>this.tick(),this.baseMs/s);this.bus.emit('loop:speed',{speed:s})}
 pause(r){this.reasons.add(r);this.bus.emit('loop:pause',{reasons:[...this.reasons]})}
 resume(r){this.reasons.delete(r);this.bus.emit('loop:pause',{reasons:[...this.reasons]})}
 get paused(){return this.reasons.size>0}
}
AW.core.Loop=Loop;
})(globalThis.AW);

// ==== src/core/worldtime.js ====
// Multiverse Time: ทุกโลกมีเวลาท้องถิ่นของตัวเอง เดินตาม global tick คูณ timeRate
// เก็บเป็นจำนวนเต็มหน่วย 1/1000 เดือน (acc) จึงไม่มีเศษทศนิยมคลาดสะสม: เดือนท้องถิ่น = floor(acc/1000)
// ทุกโลกที่ลงทะเบียนเดินเวลาทุก tick แม้ผู้เล่นไม่อยู่ · อายุผู้เล่นคิดจาก global month เท่านั้น
// ดู docs/MULTIVERSE_TIME_DESIGN.md
(function(AW){
'use strict';
const UNIT=1000,OWNER='worldtime';
class WorldTime{
 constructor(state,bus,loop){this.state=state;this.bus=bus;this.loop=loop;this.rates=new Map();
  state.register('worlds_time',OWNER,()=>({current:null,traveling:null,acc:{}}));
  bus.on('month',()=>this._advance(1),{prio:50,owner:OWNER})}
 static rateUnits(rate){const u=Math.round(rate*UNIT);if(!(rate>0)||u<1||u>100*UNIT||Math.abs(u-rate*UNIT)>1e-9)throw new Error('timeRate ไม่ถูกต้อง: '+rate);return u}
 addWorld(id,rate){if(this.rates.has(id))throw new Error('โลกซ้ำ: '+id);this.rates.set(id,WorldTime.rateUnits(rate))}
 removeWorld(id){this.rates.delete(id)}
 has(id){return this.rates.has(id)}
 _acc(id){const a=this.state.get('worlds_time').acc[id];return a||0}
 month(id){if(!this.rates.has(id))throw new Error('ไม่มีโลก '+id);return Math.floor(this._acc(id)/UNIT)}
 fraction(id){return(this._acc(id)%UNIT)/UNIT}
 get current(){return this.state.get('worlds_time').current}
 _advance(n){const ev=[];this.state.mutate(OWNER,'worlds_time',t=>{for(const[id,u]of this.rates){const a=t.acc[id]||0,b=a+u*n;t.acc[id]=b;
   for(let m=Math.floor(a/UNIT)+1;m<=Math.floor(b/UNIT);m++)ev.push({world:id,month:m})}});
  for(const e of ev)this.bus.emit('world:month',e)}
 // เข้าโลกแรก (ไม่ใช่การเดินทาง)
 enter(id){this.month(id);this.state.mutate(OWNER,'worlds_time',t=>{t.current=id})}
 // Gate ปกติ months=0: ทันที global time ไม่เดิน · Gate พิเศษ months>0: global time เดินจริง n tick (อายุ +n ทุกโลกเดินตาม rate)
 travel(to,{months=0}={}){this.month(to);if(!Number.isInteger(months)||months<0)throw new Error('เวลาเดินทางต้องเป็นจำนวนเต็ม >= 0');
  const from=this.current;if(this.state.get('worlds_time').traveling)throw new Error('กำลังเดินทางอยู่');
  this.state.mutate(OWNER,'worlds_time',t=>{t.traveling={from,to,left:months};t.current=null});this.bus.emit('gate:depart',{from,to,months});
  // ถ้า error ระหว่างทาง: ยกเลิก กลับโลกต้นทาง เวลาที่ผ่านไปแล้วไม่ย้อน (ไม่ค้างสถานะ traveling)
  let done=0;try{for(let i=0;i<months;i++){this.loop.tick(true);done++;this.state.mutate(OWNER,'worlds_time',t=>{t.traveling.left--})}}
  catch(err){this.state.mutate(OWNER,'worlds_time',t=>{t.traveling=null;t.current=from});this.bus.emit('gate:abort',{from,to,months,elapsed:done,error:err.message});throw err}
  this.state.mutate(OWNER,'worlds_time',t=>{t.traveling=null;t.current=to});this.bus.emit('gate:arrive',{from,to,months});return months}
}
AW.core.WorldTime=WorldTime;AW.core.TIME_UNIT=UNIT;
})(globalThis.AW);

// ==== src/core/save.js ====
// Save System: คีย์ใหม่ 'mvh1:*' ไม่แตะคีย์ของเกมเดิม ('hunter-path-*')
// ทุกเซฟมี schema version, เวลาบันทึก, checksum · เขียนทับช่องเดิมจะเก็บเวอร์ชันก่อนหน้าไว้ที่ '.prev'
// import ทับช่องที่มีเซฟอยู่ จะสำรองของเดิมไว้ที่ '.preimport' ก่อน
// migrations[v] แปลงเซฟจากเวอร์ชัน v ไป v+1
(function(AW){
'use strict';
const PREFIX='mvh1:',PROTECTED=/^hunter-path-/,SLOT=/^[a-z0-9_]{1,24}$/;
function checksum(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(h,31)+s.charCodeAt(i))|0;return(h>>>0).toString(16)}
class SaveSystem{
 constructor(state,{storage=globalThis.localStorage,migrations={}}={}){this.state=state;this.st=storage;this.migrations=migrations}
 key(slot){const s=String(slot);if(!SLOT.test(s))throw new Error('ชื่อช่องเซฟไม่ถูกต้อง: '+s);return PREFIX+'slot'+s}
 _set(k,v){if(PROTECTED.test(k)||!k.startsWith(PREFIX))throw new Error('ห้ามเขียนคีย์นอก '+PREFIX+': '+k);this.st.setItem(k,v)}
 save(slot,meta={}){const snap=this.state.snapshot(),body=JSON.stringify(snap);const rec=JSON.stringify({v:snap.version,at:Date.now(),meta,sum:checksum(body),body});
  const k=this.key(slot),old=this.st.getItem(k);if(old)this._set(k+'.prev',old);this._set(k,rec);return true}
 // ตรวจข้อความเซฟทั้งก้อน: JSON, ฟิลด์, checksum, version, โครงสร้าง slice · คืน {rec,snap} ที่ migrate แล้ว หรือ throw
 parse(text){let rec;try{rec=JSON.parse(text)}catch(e){throw new Error('เซฟไม่ใช่ JSON')}
  if(!rec||typeof rec!=='object'||Array.isArray(rec))throw new Error('เซฟผิดรูปแบบ');
  if(!Number.isInteger(rec.v)||rec.v<0)throw new Error('เซฟไม่มี version');
  if(typeof rec.body!=='string'||typeof rec.sum!=='string')throw new Error('เซฟขาด body หรือ checksum');
  if(typeof rec.at!=='number'||(rec.meta!==undefined&&(typeof rec.meta!=='object'||rec.meta===null)))throw new Error('เซฟผิดรูปแบบ (at/meta)');
  if(checksum(rec.body)!==rec.sum)throw new Error('เซฟเสียหาย (checksum ไม่ตรง)');
  if(rec.v>AW.core.SCHEMA_VERSION)throw new Error('เซฟมาจากเวอร์ชันใหม่กว่าเกม ('+rec.v+')');
  let snap;try{snap=JSON.parse(rec.body)}catch(e){throw new Error('body เสียหาย')}
  if(!snap||snap.version!==rec.v)throw new Error('version ใน body ไม่ตรงกับหัวเซฟ');
  snap=this.migrate(snap);const err=this.state.check(snap);if(err)throw new Error('โครงสร้างเซฟผิด: '+err);return{rec,snap}}
 read(slot,{prev=false}={}){const raw=this.st.getItem(this.key(slot)+(prev?'.prev':''));if(!raw)return null;return this.parse(raw).rec}
 migrate(snap){let s=snap;while(s.version<AW.core.SCHEMA_VERSION){const f=this.migrations[s.version];if(!f)throw new Error('ไม่มี migration จากเวอร์ชัน '+s.version);s=f(s)}return s}
 load(slot,{prev=false}={}){const raw=this.st.getItem(this.key(slot)+(prev?'.prev':''));if(!raw)return false;this.state.restore(this.parse(raw).snap);return true}
 list(){const out=[];for(let i=0;i<this.st.length;i++){const k=this.st.key(i);if(k.startsWith(PREFIX)&&!k.includes('.')){try{const r=this.parse(this.st.getItem(k)).rec;out.push({key:k,at:r.at,meta:r.meta,v:r.v})}catch(e){out.push({key:k,broken:true,error:e.message})}}}return out}
 remove(slot){this.st.removeItem(this.key(slot));}
 exportSlot(slot){return this.st.getItem(this.key(slot))}
 // ตรวจครบก่อนเขียน ถ้าไม่ผ่านไม่แตะ storage เลย · ถ้าช่องมีเซฟอยู่ สำรองไว้ที่ '.preimport'
 importSlot(slot,text){if(typeof text!=='string')throw new Error('ข้อมูล import ต้องเป็นข้อความ');this.parse(text);const k=this.key(slot),old=this.st.getItem(k);
  if(old)this._set(k+'.preimport',old);this._set(k,text);return{backup:old?k+'.preimport':null}}
 legacyKeys(){const out=[];for(let i=0;i<this.st.length;i++){const k=this.st.key(i);if(PROTECTED.test(k))out.push(k)}return out}
}
AW.core.SaveSystem=SaveSystem;AW.core.SAVE_PREFIX=PREFIX;AW.core.saveChecksum=checksum;
})(globalThis.AW);

// ==== src/core/registry.js ====
// Registry กลางสำหรับข้อมูลที่ลงทะเบียน (โลก เรื่อง ตัวละคร ไอเทม ฯลฯ)
// ตรวจ: id ซ้ำ, ฟิลด์ที่จำเป็น, รูปแบบ id · ใช้เป็น Data Loader ของ World/Story Module ใน Phase ถัดไป
(function(AW){
const ID=/^[a-z][a-z0-9_]*$/;
class Registry{
 constructor(kind,required=[],validate=null){this.kind=kind;this.required=required;this.validate=validate;this.items=new Map()}
 add(def){const errs=this.check(def);if(errs.length)throw new Error(`${this.kind} "${def&&def.id}" ไม่ถูกต้อง: ${errs.join('; ')}`);this.items.set(def.id,Object.freeze(def));return def}
 check(def){const e=[];if(!def||typeof def!=='object')return['ไม่ใช่ object'];if(!ID.test(def.id||''))e.push('id ต้องเป็น a-z0-9_ ขึ้นต้นด้วยตัวอักษร');if(this.items.has(def.id))e.push('id ซ้ำ');
  for(const f of this.required)if(def[f]===undefined)e.push('ขาดฟิลด์ '+f);if(this.validate)e.push(...(this.validate(def)||[]));return e}
 get(id){return this.items.get(id)}
 has(id){return this.items.has(id)}
 all(){return[...this.items.values()]}
 loadAll(defs){const ok=[],bad=[];for(const d of defs){try{ok.push(this.add(d).id)}catch(err){bad.push(err.message)}}return{ok,bad}}
}
AW.core.Registry=Registry;
})(globalThis.AW);

// ==== src/core/assets.js ====
// Asset Registry: เกมอ้างภาพด้วย id เท่านั้น ไม่อ้าง path
// ถ้ายังไม่มีไฟล์จริง หรือไฟล์ไม่มีสัญญาอนุญาตที่ยืนยัน ระบบจะคืนภาพ placeholder ที่เขียนคำว่า PLACEHOLDER ชัดเจน
// เปลี่ยนภาพภายหลัง = แก้ manifest ไม่ต้องแก้ game logic
(function(AW){
const LICENSES=new Set(['own','cc0','cc-by','craftpix-free','gandalfhardcore','licensed']);
class AssetRegistry{
 constructor({imageFactory=null,canvasFactory=null,allowUnlicensed=false}={}){this.defs=new Map();this.cache=new Map();this.img=imageFactory;this.cv=canvasFactory;this.allowUnlicensed=allowUnlicensed}
 register(def){const need=['id','kind','w','h'];for(const f of need)if(def[f]===undefined)throw new Error(`asset ${def.id}: ขาด ${f}`);if(this.defs.has(def.id))throw new Error('asset id ซ้ำ: '+def.id);
  this.defs.set(def.id,{frames:1,anchor:'bottom-center',world:'shared',license:null,src:null,...def})}
 registerAll(list){list.forEach(d=>this.register(d))}
 usable(d){return !!d.src&&(this.allowUnlicensed||LICENSES.has(d.license))}
 status(id){const d=this.defs.get(id);if(!d)return 'missing';return this.usable(d)?'real':'placeholder'}
 get(id){if(this.cache.has(id))return this.cache.get(id);const d=this.defs.get(id);let out;
  if(d&&this.usable(d)&&this.img){out=this.img(d.src)}else{out=this.placeholder(d||{id,w:32,h:32,kind:'missing'})}this.cache.set(id,out);return out}
 placeholder(d){if(!this.cv)return{placeholder:true,id:d.id,w:d.w,h:d.h};const c=this.cv(d.w,d.h),g=c.getContext('2d');
  let h=0;for(const ch of d.id)h=(h*31+ch.charCodeAt(0))>>>0;g.fillStyle=`hsl(${h%360},35%,30%)`;g.fillRect(0,0,d.w,d.h);g.strokeStyle='#ff3b9a';g.lineWidth=2;g.strokeRect(1,1,d.w-2,d.h-2);

function validateWorld(d,{assets}={}){const e=[];
 if(typeof d.name!=='string'||!d.name)e.push('name ต้องเป็นข้อความ');
 if(typeof d.description!=='string')e.push('description ต้องเป็นข้อความ');
 try{C.WorldTime.rateUnits(d.timeRate)}catch(x){e.push(x.message)}
 if(!d.config||kindOf(d.config)!=='object')e.push('config ต้องเป็น object');
 if(!ID.test(d.assetNs||''))e.push('assetNs ไม่ถูกต้อง');if(!ID.test(d.storyNs||''))e.push('storyNs ไม่ถูกต้อง');
 const m=d.module;if(!m||typeof m!=='object')e.push('module ต้องเป็น object');
 else for(const h of Object.keys(m))if(!HOOKS.includes(h)||typeof m[h]!=='function')e.push('module.'+h+' ไม่รู้จักหรือไม่ใช่ฟังก์ชัน');
 if(d.state!==undefined&&typeof d.state!=='function')e.push('state ต้องเป็นฟังก์ชันคืนค่าเริ่มต้น');
 if(d.state){let s;try{s=d.state()}catch(x){e.push('state() error: '+x.message)}if(s!==undefined&&kindOf(s)!=='object')e.push('state() ต้องคืน object');
  else if(s){try{JSON.stringify(s)}catch(x){e.push('state ต้องเป็น JSON')}}}
 const data=d.data||{};
 for(const k of['locations','npcs','quests','events','gates','assets'])if(data[k]!==undefined&&!Array.isArray(data[k]))e.push('data.'+k+' ต้องเป็น array');
 if(e.length)return e;
 for(const k of['locations','npcs','quests','events','gates']){const seen=new Set();for(const x of data[k]||[]){if(!x||!ID.test(x.id||''))e.push('data.'+k+': id ผิดรูปแบบ "'+(x&&x.id)+'"');else if(seen.has(x.id))e.push('data.'+k+': id ซ้ำ "'+x.id+'"');else seen.add(x.id)}}

class WorldSystem{

// ==== src/ui/shell.js ====
// หน้าทดสอบ Core + World System (Phase 2): ไม่ใช่ UI ของเกมจริง ใช้ตรวจ loop, save, asset, debug, โลก และ gate ในเบราว์เซอร์
(function(AW){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function boot(){const E=new AW.core.Engine({assets:{imageFactory:src=>{const i=new Image();i.src=src;return i},canvasFactory:(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c}}});
 E.assets.registerAll(AW.data.assets);E.use(AW.systems.WorldsModule);const wr=E.worlds.registerAll(AW.data.worlds);if(wr.bad.length)wr.bad.forEach(m=>E.debug.error(m));
 window.addEventListener('error',e=>E.debug.error('window: '+e.message));
 E.bus.on('month',({month})=>E.debug.log('เดือน '+month),{owner:'shell'});
 AW.engine=E;newGame('demo');render();E.bus.on('world:enter',()=>{_gw=null;update()},{owner:'shell'});setInterval(draw,200);
 E.bus.on('month:after',update,{owner:'shell'});E.bus.on('loop:pause',update,{owner:'shell'});return E}
function newGame(seed){const E=AW.engine;E.newGame({seed});E.worlds.start('hunter')}
function bgId(){const E=AW.engine,id=E.worlds.current,c=id&&E.worlds.ctx(id);if(!c)return 'hunter.bg.city_day';const l=c.locations.get(c.get().location)||c.locations.get(c.def.entry);return c.def.assetNs+'.'+l.bg}
function draw(){const cv=$('#stage');if(!cv)return;const g=cv.getContext('2d'),E=AW.engine;g.imageSmoothingEnabled=false;g.clearRect(0,0,cv.width,cv.height);
 g.drawImage(E.assets.get(bgId()),0,0,576,324);g.drawImage(E.assets.get('shared.char.base_m'),200,230,80,64);g.drawImage(E.assets.get('hunter.mon.goblin'),380,180,128,128);g.drawImage(E.assets.get('hunter.item.mana_stone'),30,30,32,32)}
function render(){ $('#app').innerHTML=`<header><b>Multiverse Hunter · Core Test (Phase 2)</b><span id="status"></span><span id="world"></span></header>
 <canvas id="stage" width="576" height="324"></canvas>
 <div class="row">${[0,1,3,10].map(s=>`<button data-s="${s}">${s?s+'x':'หยุด'}</button>`).join('')}<button id="step">+1 เดือน</button><button id="menu">เปิด/ปิดเมนู (หยุดเวลา)</button><button id="new">เกมใหม่</button></div>
 <div class="row">${[0,1,2].map(i=>`<button data-save="${i}">เซฟช่อง ${i}</button><button data-load="${i}">โหลดช่อง ${i}</button>`).join('')}</div>
<div class="row" id="gates"></div>
<div id="info"></div>`;
 wire();update()}
function info(){const E=AW.engine,r=E.assets.report();return `<p>ภาพ: จริง ${r.real} · placeholder ${r.placeholder} · โลกที่ลงทะเบียน ${E.registries.world.all().length} · เซฟเกมเดิมที่พบ (ไม่แตะ) ${E.save.legacyKeys().length}</p>
 <p>เซฟใหม่: ${E.save.list().map(s=>esc(s.key)+(s.broken?' (เสีย)':` v${s.v} เดือน ${s.meta&&s.meta.month}`)).join(' · ')||'ยังไม่มี'}</p>
 <details id="dbg" ${window.__dbgOpen?'open':''}><summary>Debug</summary><p class="err">${E.debug.errors.map(esc).join('<br>')||'ไม่มี error'}</p><pre>${esc(JSON.stringify(E.state.snapshot(),null,1))}</pre><pre>${E.debug.lines.slice(-12).map(l=>esc(l.lvl+' '+l.msg)).join('\n')}</pre></details>`}
let _last=0,_gw;function worldLine(){const E=AW.engine,cur=E.worlds.current,tr=E.state.get('worlds_time').traveling;
 return `โลก: ${tr?'กำลังเดินทาง':cur?esc(E.worlds.ctx(cur)?E.worlds.ctx(cur).def.name:cur+' (ยังไม่ติดตั้ง)'):'-'} · `+E.worlds.ids().map(id=>`${id} เดือน ${E.time.month(id)}`).join(' · ')}
function gates(){const E=AW.engine,el=$('#gates');if(!el||_gw===E.worlds.current)return;_gw=E.worlds.current;
 el.innerHTML=E.worlds.gatesHere().map(g=>`<button data-gate="${g.id}">${esc(g.name)}</button>`).join('')||(E.worlds.current&&!E.worlds.has(E.worlds.current)?E.worlds.ids().map(id=>`<button data-go="${id}">กลับไป ${id}</button>`).join(''):'');
 el.querySelectorAll('[data-gate]').forEach(b=>b.onclick=()=>{try{E.worlds.travelVia(b.dataset.gate)}catch(e){E.debug.error(e.message)}_last=0;update()});
 el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{try{E.worlds.travel(b.dataset.go)}catch(e){E.debug.error(e.message)}_last=0;update()})}
function update(){const E=AW.engine,m=E.loop.month,meta=E.state.get('meta'),st=$('#status');if(!st)return;
 st.textContent=`เดือน ${m} (อายุ ${15+Math.floor(m/12)} ปี ${m%12} เดือน) · seed ${meta.seed} · ${E.loop.paused?'หยุด: '+[...E.loop.reasons].join(', '):'ความเร็ว '+E.loop.speed+'x'}`;
 $('#world').textContent=worldLine();gates();
 const now=Date.now();if(now-_last<500&&E.loop.speed)return;_last=now;$('#info').innerHTML=info();$('#dbg').ontoggle=e=>window.__dbgOpen=e.target.open}
function wire(){const E=AW.engine;
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{E.loop.setSpeed(+b.dataset.s);update()});
 $('#step').onclick=()=>{E.loop.step(1);update()};$('#new').onclick=()=>{newGame(String(Date.now()));_gw=null;_last=0;update()};
 $('#menu').onclick=()=>{E.loop.reasons.has('menu')?E.loop.resume('menu'):E.loop.pause('menu')};
 document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{E.saveTo(+b.dataset.save);_last=0;update()});
 document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{try{E.loadFrom(+b.dataset.load)}catch(e){E.debug.error(e.message)}_gw=null;_last=0;update()});
 draw()}
AW.ui.boot=boot;
})(globalThis.AW);
