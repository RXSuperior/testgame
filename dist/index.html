<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f1a"><title>Multiverse Hunter</title>
<style>/* Multiverse Hunter UI theme (Phase 7A): Modern Hunter + Dark Fantasy + Korean Manhwa
   สีทั้งหมดอยู่ในตัวแปรด้านล่าง เปลี่ยนธีมได้ที่เดียว · ไม่มี gameplay ในไฟล์นี้ */
:root{
 --bg:#0b0f1a;--bg2:#10162a;--panel:#141b2e;--panel2:#1a2340;--line:#27325a;--line2:#34427a;
 --text:#e8ebf5;--muted:#9aa5c4;--dim:#6b7699;
 --blue:#4cc3ff;--violet:#9b7bff;--gold:#f2c14e;--red:#ff5c6c;--green:#5fe3a1;
 --glow:0 0 0 1px rgba(76,195,255,.35),0 0 18px rgba(76,195,255,.18);
 --r:12px;--hdr:64px;--side:220px;--right:300px;
 --font:"Sarabun","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#1b1640 0,transparent 60%),radial-gradient(900px 500px at 0% 0%,#0e2340 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.6 var(--font);min-height:100%}
body{overflow-x:hidden}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:38px;transition:border-color .15s,background .15s,transform .05s}
button:hover:not(:disabled){border-color:var(--blue);background:#1f2a50}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:linear-gradient(135deg,#2a5bd7,#6a3fd6);border-color:transparent}
button.danger,.err{color:var(--red)}
button.danger{border-color:rgba(255,92,108,.5)}
button.gold{border-color:rgba(242,193,78,.6);color:var(--gold)}
button.ghost{background:transparent}
button.sm{min-height:30px;padding:4px 10px;font-size:13px}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;background:#0a0e1a;color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;max-width:100%}
.ok{color:var(--green)} .gold-t{color:var(--gold)} .muted{color:var(--muted)} .dim{color:var(--dim)} small{color:var(--muted)}
pre{background:#080b14;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:240px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-word}
h2,h3,h4{margin:0 0 8px;font-weight:700;letter-spacing:.2px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px;color:var(--muted)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr) var(--right);grid-template-rows:var(--hdr) 1fr;grid-template-areas:"hdr hdr hdr" "side main right";min-height:100vh}
.hdr{grid-area:hdr;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:8px 16px;background:rgba(11,15,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);min-width:0}
.side{grid-area:side;position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow-y:auto;padding:12px 10px;border-right:1px solid var(--line);background:rgba(16,22,42,.6)}
.main{grid-area:main;padding:16px;min-width:0}
.right{grid-area:right;position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow-y:auto;padding:12px;border-left:1px solid var(--line);background:rgba(16,22,42,.5)}
.bnav{display:none}
.app.no-right{grid-template-columns:var(--side) minmax(0,1fr) 0}
.app.no-right .right{display:none}

/* ---------- header ---------- */
.brand{font-weight:800;letter-spacing:.5px;white-space:nowrap;background:linear-gradient(90deg,var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hstats{display:flex;align-items:center;gap:14px;flex:1;min-width:0;overflow:hidden}
.hstat{display:flex;flex-direction:column;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap}
.hstat b{color:var(--text);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.hctl{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.hctl button{min-height:32px;padding:4px 9px;font-size:13px}
.hctl button.on{border-color:var(--blue);box-shadow:var(--glow)}
.bar{position:relative;height:6px;width:90px;background:#0a0e1a;border-radius:6px;overflow:hidden;margin-top:3px}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.bar.hp>i{background:linear-gradient(90deg,#ff5c6c,#ff9a6c)} .bar.mp>i{background:linear-gradient(90deg,#4cc3ff,#9b7bff)} .bar.xp>i{background:linear-gradient(90deg,#f2c14e,#ffe08a)}
.rank{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:8px;font-weight:800;color:#1b1300;background:linear-gradient(135deg,#f2c14e,#ffe9a8);box-shadow:0 0 12px rgba(242,193,78,.35)}
.rank.none{background:var(--panel2);color:var(--muted);box-shadow:none}
.ap i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;background:#24304f;border:1px solid var(--line2)}
.ap i.on{background:var(--blue);box-shadow:0 0 8px var(--blue)}
#status{display:none} #world{font-size:12px;color:var(--muted);white-space:nowrap}
.menu-btn{display:none}

/* ---------- side nav ---------- */
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border-color:transparent;min-height:40px;color:var(--muted)}
.nav button .ic{width:22px;text-align:center;font-size:16px}
.nav button.active{color:var(--text);background:linear-gradient(90deg,rgba(76,195,255,.18),rgba(155,123,255,.08));border-color:rgba(76,195,255,.4)}
.nav .sep{margin:10px 8px 4px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}

/* ---------- cards & panels ---------- */
.card,.panel{background:linear-gradient(180deg,rgba(26,35,64,.85),rgba(20,27,46,.92));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.panel.compact{padding:10px}
.card.event{border-color:rgba(155,123,255,.55);box-shadow:0 0 30px rgba(155,123,255,.15)}
.card.danger{border-color:rgba(255,92,108,.55)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile{background:rgba(10,14,26,.6);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.tile .t{font-weight:700} .tile .s{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px} .kv span:nth-child(odd){color:var(--muted)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.badge.gold{color:var(--gold);border-color:rgba(242,193,78,.5)} .badge.red{color:var(--red);border-color:rgba(255,92,108,.5)} .badge.blue{color:var(--blue);border-color:rgba(76,195,255,.5)} .badge.vio{color:var(--violet);border-color:rgba(155,123,255,.5)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.empty{padding:18px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:10px}
.todo{padding:8px 10px;border:1px dashed rgba(242,193,78,.5);color:var(--gold);border-radius:10px;font-size:13px}
.list>div{padding:8px 0;border-bottom:1px solid var(--line)} .list>div:last-child{border-bottom:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:0 1 auto}
.choice-list{display:flex;flex-direction:column;gap:8px}
.choice-list button{text-align:left;width:100%}

/* ---------- scene ---------- */
.scene{position:relative;width:100%;aspect-ratio:16/9;max-height:40vh;border-radius:var(--r);overflow:hidden;border:1px solid var(--line2);background:#000;margin-bottom:12px}
.scene canvas{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.scene .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(transparent,rgba(5,8,16,.9))}
.scene .cap b{font-size:18px} .scene .tag{position:absolute;top:10px;right:10px}

/* ---------- special screens ---------- */
.screen{border:1px solid rgba(155,123,255,.45);border-radius:var(--r);background:linear-gradient(180deg,rgba(28,22,58,.95),rgba(16,20,40,.95));padding:16px;margin-bottom:12px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.screen.combat{border-color:rgba(255,92,108,.55)}
.screen h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.unit{background:rgba(10,14,26,.6);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.unit .bar{width:100%}
.unit.down{opacity:.5}
.app.focus .page{display:none!important}
.app.focus .page.show-in-focus{display:block!important}
.focus-note{margin-bottom:10px}
.page{display:none}
.page.active{display:block}

/* ---------- right panel ---------- */
.right .panel{padding:10px} .right h4{margin-bottom:6px}
.feed small{display:block;padding:3px 0;border-bottom:1px solid rgba(39,50,90,.6)}

/* ---------- overlays ---------- */
#modal:empty,#combat:empty,#adv:empty,#create:empty{display:none}
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(3,5,12,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dialog.wide{width:min(640px,100%)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s ease-out}
.toast.bad{border-left-color:var(--red)} .toast.good{border-left-color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.loading{padding:40px;text-align:center;color:var(--muted)}

/* ---------- debug ---------- */
.devp{border-color:rgba(242,193,78,.4)}
.devp summary{cursor:pointer;color:var(--gold)}

/* ---------- tablet ---------- */
@media (max-width:1199px){
 .app{grid-template-columns:200px minmax(0,1fr);grid-template-areas:"hdr hdr" "side main" "side right"}
 .right{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
 .app.no-right{grid-template-columns:200px minmax(0,1fr)}
 .hstat.opt{display:none}
}
/* ---------- mobile ---------- */
@media (max-width:767px){
 :root{--hdr:auto}
 .app,.app.no-right{grid-template-columns:minmax(0,1fr);grid-template-areas:"hdr" "main" "right";padding-bottom:72px}
 .hdr{flex-wrap:wrap;gap:8px;padding:8px 10px}
 .brand{display:none}
 .hstats{order:2;width:100%;gap:10px;overflow-x:auto;flex:1 1 100%}
 .hstat.opt,.hstat.opt2{display:none}
 .hctl{order:1;margin-left:auto;flex-wrap:wrap}
 .menu-btn{display:inline-flex}
 .opt-right{display:none}
 .side{position:fixed;inset:0 25% 0 0;z-index:70;height:100vh;transform:translateX(-105%);transition:transform .2s;background:var(--bg2);top:0}
 .side.open{transform:none;box-shadow:0 0 0 100vw rgba(3,5,12,.6)}
 .main{padding:10px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,15,26,.96);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0;background:transparent;border-color:transparent;font-size:11px;min-height:52px;padding:4px 2px;color:var(--muted)}
 .bnav button .ic{font-size:18px}
 .bnav button.active{color:var(--blue)}
 .vs{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
 .scene{max-height:none}
 button{min-height:44px}
 #toasts{left:12px;right:12px;bottom:80px;max-width:none}
}
</style></head><body><div id="app" class="app"><div class="loading">กำลังโหลดโลกฮันเตอร์…</div></div>
<script>// ==== src/core/ns.js ====
// Namespace กลาง: ทุกโมดูลลงทะเบียนที่ AW ไม่สร้างตัวแปร global อื่น
(function(g){g.AW=g.AW||{core:{},systems:{},data:{worlds:[],assets:[]},ui:{}}})(globalThis);

// ==== src/core/rng.js ====
// สุ่มแบบมี seed (mulberry32) สถานะเป็นตัวเลขเดียว เก็บในเซฟได้ ผลซ้ำได้เมื่อ seed เดิม
(function(AW){
function hashSeed(s){let h=2166136261>>>0;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
class Rng{
 constructor(seed){this.state=typeof seed==='number'?seed>>>0:hashSeed(seed??Date.now())}
 next(){let t=this.state=(this.state+0x6D2B79F5)>>>0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
 int(a,b){return a+Math.floor(this.next()*(b-a+1))}
 chance(p){return this.next()<p}
 pick(arr){return arr[Math.floor(this.next()*arr.length)]}
}
AW.core.Rng=Rng;AW.core.hashSeed=hashSeed;
})(globalThis.AW);

// ==== src/core/bus.js ====
// Event Bus: ระบบคุยกันผ่านเหตุการณ์ แทนการห่อฟังก์ชันของกันและกัน
// ตัวรับที่ error ไม่หยุดตัวรับอื่น (error ถูกส่งต่อเป็นเหตุการณ์ 'bus:error')
(function(AW){
class Bus{
 constructor(){this.h=new Map();this.trace=null}
 on(ev,fn,{prio=0,owner='?'}={}){const l=this.h.get(ev)||[];const e={fn,prio,owner};l.push(e);l.sort((a,b)=>b.prio-a.prio);this.h.set(ev,l);return()=>this.off(ev,fn)}
 off(ev,fn){const l=this.h.get(ev);if(l)this.h.set(ev,l.filter(e=>e.fn!==fn))}
 emit(ev,payload){if(this.trace)this.trace(ev,payload);const l=this.h.get(ev);if(!l)return 0;let n=0;
  for(const e of l.slice()){try{e.fn(payload);n++}catch(err){if(ev!=='bus:error')this.emit('bus:error',{ev,owner:e.owner,err});else console.error(err)}}return n}
 listeners(ev){return(this.h.get(ev)||[]).map(e=>e.owner)}
}
AW.core.Bus=Bus;
})(globalThis.AW);

// ==== src/core/state.js ====
// Game State: แบ่งเป็น slice แต่ละ slice มีเจ้าของ (ระบบเดียวที่เขียนได้)
// อ่าน: state.get(name) ได้ object ที่ freeze ทั้งต้นไม้ แก้ไม่ได้ (strict mode จะ throw)
// เขียน: state.mutate(owner,name,fn) fn ได้สำเนาที่แก้ได้ แล้วสำเนานั้นจะถูก freeze เป็นค่าใหม่ (copy-on-write)
// อ่านไม่เสียค่าใช้จ่าย เขียนเสียค่า clone ของ slice นั้น slice เดียว
// ข้อมูลใน slice ต้องเป็น JSON ล้วน (เพราะต้องเซฟได้)
(function(AW){
'use strict';
const SCHEMA_VERSION=1;
const clone=v=>v===undefined?v:JSON.parse(JSON.stringify(v));
function deepFreeze(o){if(o&&typeof o==='object'&&!Object.isFrozen(o)){Object.freeze(o);for(const k of Object.keys(o))deepFreeze(o[k])}return o}
const kind=v=>Array.isArray(v)?'array':v===null?'null':typeof v;
class GameState{
 constructor(bus){this.bus=bus;this.slices=new Map();this.data={};this.orphans={}}
 // slice ที่มีในเซฟแต่ยังไม่มีใครลงทะเบียน (orphan) จะถูกเก็บไว้ไม่หาย และถูกรับไปใช้เมื่อมีการ register ชื่อนั้นทีหลัง
 register(name,owner,init){if(this.slices.has(name))throw new Error(`slice "${name}" ซ้ำ (เจ้าของเดิม ${this.slices.get(name).owner})`);this.slices.set(name,{owner,init});
  const o=this.orphans[name],fresh=init();delete this.orphans[name];this.data[name]=deepFreeze(clone(o!==undefined&&kind(o)===kind(fresh)?o:fresh))}
 // ถอน slice (ใช้ตอน rollback การติดตั้งที่ไม่สำเร็จ) เจ้าของเท่านั้น · keep=true คืนข้อมูลไปเป็น orphan
 unregister(name,owner,{keep=false}={}){if(this.owner(name)!==owner)throw new Error(`"${owner}" ถอน slice "${name}" ไม่ได้`);if(keep)this.orphans[name]=this.data[name];this.slices.delete(name);delete this.data[name]}
 owner(name){const s=this.slices.get(name);if(!s)throw new Error(`ไม่มี slice "${name}"`);return s.owner}
 get(name){if(!this.slices.has(name))throw new Error(`ไม่มี slice "${name}"`);return this.data[name]}
 mutate(owner,name,fn){const o=this.owner(name);if(o!==owner)throw new Error(`"${owner}" เขียน slice "${name}" ไม่ได้ (เจ้าของคือ "${o}")`);
  const draft=clone(this.data[name]);const r=fn(draft);this.data[name]=deepFreeze(draft);this.bus&&this.bus.emit('state:changed',{name,owner});return r}
 reset(){this.orphans={};for(const[n,s]of this.slices)this.data[n]=deepFreeze(clone(s.init()))}
 snapshot(){return{version:SCHEMA_VERSION,data:clone(Object.assign({},this.orphans,this.data))}}
 // ตรวจรูปแบบ snapshot โดยไม่แตะ state: คืน null ถ้าผ่าน หรือข้อความ error
 check(snap){if(!snap||typeof snap!=='object')return'snapshot ไม่ใช่ object';if(snap.version!==SCHEMA_VERSION)return'เวอร์ชันเซฟไม่ตรง ('+snap.version+')';
  if(kind(snap.data)!=='object')return'data ต้องเป็น object';
  for(const[n,s]of this.slices){if(!(n in snap.data))continue;const a=kind(snap.data[n]),b=kind(s.init());if(a!==b)return`slice "${n}" ผิดชนิด (${a} แทน ${b})`}return null}
 restore(snap){const e=this.check(snap);if(e)throw new Error(e);this.reset();for(const n of Object.keys(snap.data)){if(this.slices.has(n))this.data[n]=deepFreeze(clone(snap.data[n]));else this.orphans[n]=deepFreeze(clone(snap.data[n]))}}
}
AW.core.GameState=GameState;AW.core.SCHEMA_VERSION=SCHEMA_VERSION;AW.core.deepFreeze=deepFreeze;
})(globalThis.AW);

// ==== src/core/loop.js ====
// Game Loop: 1 tick = 1 เดือนของโลกหลัก
// ลำดับต่อ tick: month:before -> month -> month:after (ระบบต่าง ๆ ฟังเหตุการณ์เหล่านี้)
// หยุดได้หลายเหตุผลพร้อมกัน (เปิดเมนู, มีเหตุการณ์รอ, ต่อสู้) เดินต่อเมื่อเหตุผลหมด
(function(AW){
'use strict';
class Loop{
 constructor(state,bus,{owner='loop',baseMs=1200,timer=globalThis}={}){this.state=state;this.bus=bus;this.owner=owner;this.baseMs=baseMs;this.timer=timer;this.speed=0;this.reasons=new Set();this.h=null;
  state.register('time',owner,()=>({month:0}))}
 get month(){return this.state.get('time').month}
 tick(force=false){if(this.reasons.size&&!force)return false;const m=this.month+1;this.bus.emit('month:before',{month:m});this.state.mutate(this.owner,'time',t=>{t.month=m});this.bus.emit('month',{month:m});this.bus.emit('month:after',{month:m});return true}
 step(n=1){let d=0;for(let i=0;i<n;i++)if(this.tick())d++;return d}
 setSpeed(s){this.speed=s;if(this.h){this.timer.clearInterval(this.h);this.h=null}if(s>0)this.h=this.timer.setInterval(()=>this.tick(),this.baseMs/s);this.bus.emit('loop:speed',{speed:s})}
 pause(r){this.reasons.add(r);this.bus.emit('loop:pause',{reasons:[...this.reasons]})}
 resume(r){this.reasons.delete(r);this.bus.emit('loop:pause',{reasons:[...this.reasons]})}
 get paused(){return this.reasons.size>0}
}
AW.core.Loop=Loop;
})(globalThis.AW);

// ==== src/core/worldtime.js ====

 app.addEventListener('click',e=>{if(U.confirmClick(e))return;const b=e.target.closest('button,[data-dlgclose]');if(!b)return;if(b.disabled)return;const d=b.dataset;
  if(d.dlgclose!==undefined){if(b.tagName!=='BUTTON'&&e.target!==b)return;st.dlg=null;update(true);return}
  if(d.nav){go(d.nav);return}
  if(d.navToggle){st.navOpen=!st.navOpen;update(true);return}
  if(d.s!==undefined){E.loop.setSpeed(+d.s);update(true);return}
  if(b.id==='step'){E.loop.step(1);update(true);return}
  if(b.id==='menu'){E.loop.reasons.has('menu')?E.loop.resume('menu'):E.loop.pause('menu');update(true);return}
  if(d.save!==undefined){act(()=>{E.saveTo(+d.save)},'เซฟช่อง '+d.save+' แล้ว');return}
  if(d.load!==undefined){try{E.loadFrom(+d.load);if(!E.worlds.current)E.worlds.start('hunter');U.toast('โหลดช่อง '+d.load+' แล้ว','good')}catch(err){E.debug.error(err.message);U.toast('โหลดไม่ได้: '+err.message,'bad')}st.result=null;st.dlg=null;update(true);return}
  if(b.id==='new'){newGame(String(Date.now()));update(true);return}
  if(b.id==='new2'){newGame(String(Date.now()));go('dashboard');return}
  if(b.id==='pcreate'){createPlayer(($('#pname').value||'').trim()||'ซอนอู',$('#pgender').value);go('dashboard');return}
  if(d.a==='newgame'){U.confirm('เริ่มเกมใหม่?','ความคืบหน้าที่ยังไม่ได้เซฟจะหายไป เซฟที่มีอยู่ไม่ถูกลบ',()=>{newGame(String(Date.now()));go('dashboard')},{yes:'เริ่มใหม่',danger:true});return}
  if(d.a==='toggleRight'){st.right=!st.right;ss.set('mvh-ui-right',st.right?'1':'0');update(true);return}
  if(d.a==='toggleDev'){ss.set('mvh-ui-dev',AW.ui.dev()&&ss.get('mvh-ui-dev')==='1'?'0':'1');update(true);return}
  if(d.a==='backFocus'){st.override=false;update(true);return}
  if(d.dlg){st.dlg=d.dlg;update(true);return}
  if(d.ok){st.result=null;update(true);return}
  if(d.choice!==undefined){act(()=>E.events.answer(+d.choice));return}
  if(d.loc){act(()=>{E.player.moveTo(d.loc)});return}
  if(d.act){act(()=>E.events.doAction(d.act));return}
  if(d.mis){if(d.accept&&!confirm2(b))return;act(()=>E.missions.start(d.mis,{acceptRisk:!!d.accept}));return}
  if(d.cact){act(()=>{E.combat.act(d.cact==='skill'?{type:'skill',id:d.cid}:{type:d.cact})});return}
  if(d.invite){act(()=>{E.party.invite(d.invite)},'เข้าร่วมทีมแล้ว');return}
  if(d.pleave){const n=E.npcs.get(d.pleave);U.confirm('ให้ออกจากทีม?',`${n?n.name:''} จะออกจากทีม ความสัมพันธ์อาจลดลง`,()=>act(()=>{E.party.leave(d.pleave,'ผู้เล่นให้ออก')},'ออกจากทีมแล้ว'),{yes:'ให้ออก',danger:true});return}
  if(d.upg){act(()=>{E.player.upgrade(d.upg)},'อัปเกรดแล้ว');return}
  if(d.equip){act(()=>{E.player.equip(d.equip)},'สวมแล้ว');return}
  if(d.repair){act(()=>{E.economy.repair(d.repair)},'ซ่อมแล้ว');return}
  if(d.svc){act(()=>{E.economy.buy(d.svc)},'ดำเนินการแล้ว');return}
  if(d.svcx){act(()=>{E.economy.cancel(d.svcx)},'หยุดบริการแล้ว');return}
  if(d.svcr){act(()=>{E.economy.resume(d.svcr)},'ใช้บริการต่อแล้ว');return}
  if(d.inv){act(()=>{E.economy.invest(d.inv,+d.amt)},'ลงทุนแล้ว');return}
  if(d.wd){act(()=>{E.economy.withdraw(d.wd,+d.amt)},'ถอนเงินแล้ว');return}
  if(d.dgin){if(d.accept&&!confirm2(b))return;act(()=>{E.dungeon.enter(d.dgin,{fromCheckpoint:!!d.cp})});return}
  if(d.dg){act(()=>{const r=d.dg==='advance'?E.dungeon.advance():d.dg==='leave'?E.dungeon.leave():E.dungeon.close();if(r&&r.status)st.result={title:'ผลการสำรวจ',text:({cleared:'เคลียร์ดันเจี้ยน',left:'ออกจากดันเจี้ยน',retreated:'ถอนตัว',failed:'สำรวจล้มเหลว'})[r.status]+` · เงิน ${r.money} EXP ${r.exp}`,effects:(r.items||[]).concat(r.clear||[])};else if(r&&r.fight&&r.fight.outcome!=='win')st.result={title:'ต่อสู้ในดันเจี้ยน',success:false,text:r.fight.outcome,fight:r.fight}});return}
  if(d.tw){if(d.accept&&!confirm2(b))return;act(()=>{E.tower.climb(d.tw,{acceptRisk:!!d.accept})});return}
  if(d.gate){act(()=>{E.worlds.travelVia(d.gate)});return}
  if(d.go){act(()=>{E.worlds.travel(d.go)});return}
  if(d.ia){act(()=>E.rels.interact(d.npc,d.ia));return}
  if(d.job){act(()=>{E.life.takeJob(d.job)},'เริ่มงานแล้ว');return}
  if(d.quit){U.confirm('ลาออกจากงาน?','อายุงานจะเริ่มนับใหม่เมื่อทำงานใหม่',()=>act(()=>{E.life.quitJob()},'ลาออกแล้ว'),{yes:'ลาออก',danger:true});return}
  if(d.home){const h=()=>act(()=>{E.life.moveIn(d.home,d.mode)},'ย้ายที่พักแล้ว');if(d.mode==='own')U.confirm('ซื้อที่พัก?','การซื้อบ้านใช้เงินก้อนใหญ่ และมีค่าดูแลรายเดือน',h,{yes:'ซื้อ'});else h();return}
  if(d.pgate){act(()=>{E.gates.travel(d.pgate)});return}});
 app.addEventListener('toggle',e=>{if(e.target.id==='dbg')window.__dbgOpen=e.target.open},true)}
// ---- Debug panel (เฉพาะโหมดพัฒนา: ?debug=1 หรือเปิดในหน้าระบบ) ----
AW.ui.debugPanel=E=>{const r=E.assets.report(),dg=E.worlds.gatesHere().map(g=>`<button class="sm" data-gate="${g.id}">${esc(g.name)}</button>`).join('')||(E.worlds.current&&!E.worlds.has(E.worlds.current)?E.worlds.ids().map(id=>`<button class="sm" data-go="${id}">กลับไป ${id}</button>`).join(''):'');
 return `<div class="panel devp"><h3 class="gold-t">Debug (โหมดพัฒนา)</h3><div class="row" id="gates">Debug Gate: ${dg}</div><div class="row"><button id="new" class="sm">เกมใหม่ทันที (ไม่ถาม)</button></div>
 <div id="info"><p><small>ภาพ: จริง ${r.real} · placeholder ${r.placeholder} · โลกที่ลงทะเบียน ${E.registries.world.all().length} · เซฟเกมเดิมที่พบ (ไม่แตะ) ${E.save.legacyKeys().length}</small></p>
 <p><small>เซฟใหม่: ${E.save.list().map(s=>esc(s.key)+(s.broken?' (เสีย)':` v${s.v} เดือน ${s.meta&&s.meta.month}`)).join(' · ')||'ยังไม่มี'}</small></p>
 <details id="dbg" ${window.__dbgOpen?'open':''}><summary>สถานะภายใน</summary><p class="err">${E.debug.errors.map(esc).join('<br>')||'ไม่มี error'}</p><pre>${esc(JSON.stringify(E.state.snapshot(),null,1))}</pre><pre>${E.debug.lines.slice(-12).map(l=>esc(l.lvl+' '+l.msg)).join('\n')}</pre></details></div></div>`};
AW.ui.boot=boot;AW.ui.update=update;
})(globalThis.AW);
</script><script>AW.ui.boot()</script></body></html>
